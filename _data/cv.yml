    Funding and grants:
      - bullet: >
          Approximately **€200,000** in competitive personal funding, plus compute allocations on
          three national and European supercomputers.
      - bullet: >
          **FWO Strategic Basic Research Fellowship** (mandate 1SH4Z24N), Research Foundation
          Flanders — approximately €131,000, 2023–. Personal four-year fellowship; success rate
          below 20%.
      - bullet: >
          **FWO Travel Grant for a Long Research Stay Abroad** (mandate V458425N), Research
          Foundation Flanders — €9,900, 2025. Funded the research stay at Fraunhofer HHI, Berlin.
      - bullet: >
          **Pegaso Scholarship**, Regione Toscana (Giovanisì) — €61,300, 2021–2023.
      - bullet: >
          **Compute allocations**: VSC (Flanders), LUMI (EuroHPC JU) and Leonardo/CINECA — all
          competitively allocated.
      - bullet: >
          **Project participation**: EXPERIENCE (EU H2020, no. 101017727); FAIR Spoke 1
          "Human-Centered AI" (PNRR PE00000013); FoReLab (MIUR Departments of Excellence,
          University of Pisa); FWO S003524N, G0C9623N and G0D8321N.

