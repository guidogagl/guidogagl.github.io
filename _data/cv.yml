    Teaching:
      - bullet: >
          **Guest Lecturer** — *Explainable and Trustworthy Artificial Intelligence*, Ghent
          University (UGain / VAIA professional course), 2026. Coordinated by Prof. Dr. Femke
          De Backere. Contributed lectures on explainability and interpretability techniques.
      - bullet: >
          **Teaching Assistant** — *Biomedical Signal Processing*, KU Leuven, 2021–2026. M.Sc.
          programmes in Biomedical Engineering and Electrical Engineering: exercise sessions,
          student support and grading.

    Supervision:
      - bullet: >
          **12 M.Sc. theses** supervised at the University of Pisa, 2022–2026 — 10 as principal
          advisor (*relatore*), one as co-advisor, one as tutor, with Prof. M. G. C. A. Cimino and
          Prof. A. L. Alfeo. Day-to-day supervision (problem definition, method, experiments and
          writing) was mine; Cimino and Alfeo were the formal supervisors.
      - bullet: >
          Two students continued to doctoral study: **C. Daka** (University of Pisa) and
          **I. Grillo** (KU Leuven).
      - bullet: >
          The full list, with deposited titles and formal roles, is on the
          [research page](/research/#supervision-and-mentoring).

    Academic service:
      - bullet: "**Submission Chair**, IEEE ICAI-TEMS 2026, Pisa, Italy."
      - bullet: >
          **Reviewer** for AAAI 2026 and the *Journal of Ambient Intelligence and Humanized
          Computing* (Springer).
      - bullet: >
          Member of the **Sleep Revolution** network (Horizon 2020, grant agreement 965417).

    Collaborations:
      - bullet: "**Fraunhofer HHI, Berlin** — Prof. W. Samek: attribution methods for time–frequency data."
      - bullet: >
          **Technion** and **Universidade Federal de Minas Gerais** — Prof. J. A. Behar and
          Prof. A. L. P. Ribeiro: cross-cohort generalisation in physiological time series.
      - bullet: "**University of Copenhagen** — Prof. B. R. Kornum: narcoleptic mouse models."
      - bullet: >
          **Aarhus University, Center for Ear-EEG** — J. Strøm: Alzheimer's disease and REM Sleep
          Behaviour Disorder.
      - bullet: "**University of Valladolid** — Dr. J. Jiménez-García: paediatric sleep apnoea."

    Software:
      - bullet: >
          **[PhysioEx](/software/)** — PyTorch library for explainable modelling of physiological
          signals; 12 clinical cohorts behind one interface. Published in *Physiological
          Measurement* (2025); on PyPI.
      - bullet: >
          **[ProtoSleepNet](/software/)** — prototype-based interpretable sleep staging across 11
          polysomnography datasets and 12,317 subjects, with a live explainability demo.
      - bullet: >
          **[Spectral Gradients](/software/)** — disentangled time–frequency attributions
          (manuscript in preparation with Prof. W. Samek).

